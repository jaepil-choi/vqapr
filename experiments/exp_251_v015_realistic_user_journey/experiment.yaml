  measure: uv run --with psutil python experiments/exp_251_v015_realistic_user_journey/measure.py
evidence:
  directory: outputs
  report: outputs/PERFORMANCE-REPORT.md
decision: >-
  Adopt lazy panel evidence, reuse an existing panel before deriving its full identity, and read
